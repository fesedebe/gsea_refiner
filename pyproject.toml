[project]
name = "gsea-refiner"
version = "1.0.0"
description = "Supervised classification layer for gene-set to functional category mapping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "plotly>=6.7",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "seaborn>=0.13",
    "sentencepiece>=0.2.1",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.13",
    "datasets>=4.8",
    "torch>=2.11",
    "transformers>=5.8",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gsea_refiner"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
